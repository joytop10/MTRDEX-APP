<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTR Master Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --bg: #080D18;
    --card: #111B2C;
    --card2: #17243A;
    --gold: #F5C542;
    --gold2: #FFE28A;
    --blue: #1677FF;
    --text: #FFFFFF;
    --muted: #8996AA;
    --green: #22C58B;
    --red: #EF4444;
    --border: rgba(255,255,255,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
.wrapper { max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
.top-header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 18px 22px; border-radius: 16px; border: 1px solid var(--border); }
.top-header h2 { color: var(--gold); font-size: 20px; font-weight: 800; }
.badge-admin { background: rgba(245,197,66,0.15); color: var(--gold); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.stat-card { background: linear-gradient(145deg, var(--card2), var(--card)); padding: 18px; border-radius: 16px; border: 1px solid var(--border); }
.stat-label { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.stat-value { font-size: 24px; font-weight: 800; color: var(--gold); }
.stat-value.green { color: var(--green); }
.stat-value.red { color: var(--red); }

/* Tabs */
.tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.tab-btn { padding: 11px 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; }
.tab-btn.active { background: var(--gold); color: #111827; border-color: var(--gold); }

.panel-section { display: none; flex-direction: column; gap: 16px; }
.panel-section.active { display: flex; }

/* Settings Form & Search */
.box { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; }
.box h3 { font-size: 16px; color: var(--gold2); margin-bottom: 4px; }
.search-input { width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid rgba(245,197,66,0.35); background: #080D18; color: white; font-size: 14px; outline: none; }
.search-input:focus { border-color: var(--gold); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 12px; color: var(--muted); font-weight: 600; }
.form-group input, .form-group select { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #080D18; color: white; font-size: 14px; outline: none; }
.form-group input:focus { border-color: var(--gold); }

.btn-save { padding: 14px; border: 0; border-radius: 12px; background: linear-gradient(110deg, #FFE28A, #E5AC27); color: #111827; font-weight: 800; font-size: 14px; cursor: pointer; }
.btn-save:active { transform: scale(0.99); }

/* Withdraw List */
.req-card { background: linear-gradient(145deg, var(--card2), var(--card)); padding: 16px; border-radius: 14px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.req-info h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.req-info p { font-size: 12px; color: var(--muted); margin-bottom: 2px; word-break: break-all; }
.req-amount { font-size: 16px; font-weight: 800; color: var(--gold); margin-top: 4px; }
.req-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn-approve { padding: 9px 14px; border: 0; border-radius: 9px; background: var(--green); color: #080D18; font-weight: 800; font-size: 12px; cursor: pointer; }
.btn-reject { padding: 9px 14px; border: 0; border-radius: 9px; background: var(--red); color: white; font-weight: 800; font-size: 12px; cursor: pointer; }
.status-tag { padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
.tag-pending { background: rgba(245,197,66,0.15); color: var(--gold); }
.tag-approved { background: rgba(34,197,139,0.15); color: var(--green); }
.tag-rejected { background: rgba(239,68,68,0.15); color: var(--red); }

.empty { text-align: center; padding: 25px; color: var(--muted); background: var(--card); border-radius: 14px; font-size: 13px; }
</style>
</head>
<body>

<div class="wrapper">
    <div class="top-header">
        <h2>👑 MTR Master Admin</h2>
        <span class="badge-admin">CONTROL PANEL</span>
    </div>

    <!-- লাইভ স্ট্যাটাস ড্যাশবোর্ড -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">📥 Withdraw Requests (Pending)</div>
            <div class="stat-value" id="statPendingCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">✅ Withdraw Completed</div>
            <div class="stat-value green" id="statCompletedCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">❌ Withdraw Rejected</div>
            <div class="stat-value red" id="statRejectedCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">👥 Total Users</div>
            <div class="stat-value" id="statTotalUsers">0</div>
        </div>
    </div>

    <!-- নেভিগেশন ট্যাব -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchAdminTab('withdrawals', this)">📤 Withdrawals</button>
        <button class="tab-btn" onclick="switchAdminTab('referral', this)">🎁 Referral Target</button>
        <button class="tab-btn" onclick="switchAdminTab('limits', this)">⚙️ Limits & Mining</button>
        <button class="tab-btn" onclick="switchAdminTab('tasks', this)">📋 Add Task</button>
    </div>

    <!-- ১. উইথড্র রিকোয়েস্ট, সার্চ ও হিস্ট্রি সেকশন -->
    <section class="panel-section active" id="sec-withdrawals">
        <div class="box">
            <h3>📤 User Withdrawal Requests & History</h3>
            <input type="text" id="withdrawSearchInput" class="search-input" placeholder="🔍 Search by Telegram ID (UID_...), Wallet Address, Name or Status..." oninput="renderWithdrawList()">
            <div id="adminWithdrawList"><div class="empty">Loading withdrawal requests...</div></div>
        </div>
    </section>

    <!-- ২. রেফারেল টার্গেট ও রিওয়ার্ড সেটিংস -->
    <section class="panel-section" id="sec-referral">
        <div class="box">
            <h3>🎁 Referral Target & Reward Setup</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Target Verified Referrals Count</label>
                    <input type="number" id="cfgRefTarget" value="5" min="1">
                </div>
                <div class="form-group">
                    <label>Target Reward Amount (MTR)</label>
                    <input type="number" id="cfgRefTargetReward" value="10" step="any">
                </div>
                <div class="form-group">
                    <label>Per Verified Referral Commission (MTR)</label>
                    <input type="number" id="cfgRefCommission" value="0" step="any">
                </div>
            </div>
            <button class="btn-save" onclick="saveReferralSettings()">SAVE REFERRAL SETTINGS</button>
        </div>
    </section>

    <!-- ৩. উইথড্র লিমিট, মাইনিং রেট ও ওয়ালেট সেটিংস -->
    <section class="panel-section" id="sec-limits">
        <div class="box">
            <h3>⚙️ Withdraw Limits, Mining & Wallet Config</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Minimum Withdraw Limit (MTR)</label>
                    <input type="number" id="cfgMinWithdraw" value="10" step="any">
                </div>
                <div class="form-group">
                    <label>Maximum Withdraw Limit (MTR)</label>
                    <input type="number" id="cfgMaxWithdraw" value="1000" step="any">
                </div>
                <div class="form-group">
                    <label>Mining Speed (MTR / Hour)</label>
                    <input type="number" id="cfgMiningRate" value="0.1" step="any">
                </div>
                <div class="form-group">
                    <label>Verification Fee (TON)</label>
                    <input type="number" id="cfgVerifyFee" value="0.1" step="any">
                </div>
                <div class="form-group">
                    <label>Withdraw System Status</label>
                    <select id="cfgWithdrawOpen">
                        <option value="true">Open (Allow Withdraw)</option>
                        <option value="false">Closed (Maintenance)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Admin Receiving TON Wallet</label>
                    <input type="text" id="cfgAdminWallet" placeholder="Enter TON Wallet Address">
                </div>
            </div>
            <button class="btn-save" onclick="saveGeneralSettings()">SAVE ALL SETTINGS</button>
        </div>
    </section>

    <!-- ৪. টাস্ক যুক্ত করার সেকশন -->
    <section class="panel-section" id="sec-tasks">
        <div class="box">
            <h3>📋 Create New Task</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text" id="taskTitle" placeholder="Join Telegram Channel">
                </div>
                <div class="form-group">
                    <label>Reward (MTR)</label>
                    <input type="number" id="taskReward" value="5" step="any">
                </div>
                <div class="form-group">
                    <label>Task Link (https://...)</label>
                    <input type="text" id="taskLink" placeholder="https://t.me/...">
                </div>
                <div class="form-group">
                    <label>Icon Emoji</label>
                    <input type="text" id="taskIcon" value="📢">
                </div>
            </div>
            <button class="btn-save" onclick="addNewTask()">ADD TASK</button>
        </div>
    </section>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyA74QlASZn_mz9c4XjdpJAJQHyJqX9xdk4",
    authDomain: "mtrdex.firebaseapp.com",
    projectId: "mtrdex",
    storageBucket: "mtrdex.firebasestorage.app",
    messagingSenderId: "1086565020372",
    appId: "1:1086565020372:web:908ecf8369e83c4d6dc141",
    measurementId: "G-YP1ZKWZPL6"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allWithdrawals = [];

function switchAdminTab(tabName, btn) {
    document.querySelectorAll(".panel-section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("sec-" + tabName).classList.add("active");
    if (btn) btn.classList.add("active");
}

// সেটিংস লোড করা
db.collection("settings").doc("config").onSnapshot(doc => {
    if (!doc.exists) return;
    const d = doc.data();
    if (d.minWithdraw !== undefined) document.getElementById("cfgMinWithdraw").value = d.minWithdraw;
    if (d.maxWithdraw !== undefined) document.getElementById("cfgMaxWithdraw").value = d.maxWithdraw;
    if (d.miningRate !== undefined) document.getElementById("cfgMiningRate").value = d.miningRate;
    if (d.verifyFee !== undefined) document.getElementById("cfgVerifyFee").value = d.verifyFee;
    if (d.withdrawOpen !== undefined) document.getElementById("cfgWithdrawOpen").value = String(d.withdrawOpen);
    if (d.adminWallet !== undefined) document.getElementById("cfgAdminWallet").value = d.adminWallet;

    if (d.refTarget !== undefined) document.getElementById("cfgRefTarget").value = d.refTarget;
    if (d.refTargetReward !== undefined) document.getElementById("cfgRefTargetReward").value = d.refTargetReward;
    if (d.refCommission !== undefined) document.getElementById("cfgRefCommission").value = d.refCommission;
});

// টোটাল ইউজার কাউন্ট
db.collection("users").onSnapshot(snap => {
    document.getElementById("statTotalUsers").textContent = snap.size;
});

// উইথড্র রিকোয়েস্ট ও স্ট্যাটাস কাউন্টার
db.collection("withdrawals").orderBy("createdAt", "desc").onSnapshot(snap => {
    let pending = 0;
    let completed = 0;
    let rejected = 0;
    allWithdrawals = [];

    snap.forEach(doc => {
        const w = doc.data();
        const st = (w.status || "pending").toLowerCase();

        if (st === "pending") pending++;
        else if (st === "approved") completed++;
        else if (st === "rejected") rejected++;

        allWithdrawals.push({ id: doc.id, data: w, status: st });
    });

    document.getElementById("statPendingCount").textContent = pending;
    document.getElementById("statCompletedCount").textContent = completed;
    document.getElementById("statRejectedCount").textContent = rejected;

    renderWithdrawList();
});

function renderWithdrawList() {
    const query = (document.getElementById("withdrawSearchInput")?.value || "").trim().toLowerCase();
    const listEl = document.getElementById("adminWithdrawList");
    listEl.innerHTML = "";

    const filtered = allWithdrawals.filter(item => {
        if (!query) return true;
        const d = item.data;
        const uid = String(d.userId || "").toLowerCase();
        const wallet = String(d.walletAddress || "").toLowerCase();
        const name = String(d.userName || "").toLowerCase();
        const username = String(d.userUsername || "").toLowerCase();
        const st = String(item.status || "").toLowerCase();
        return uid.includes(query) || wallet.includes(query) || name.includes(query) || username.includes(query) || st.includes(query);
    });

    if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty">No matching withdrawal records found.</div>';
        return;
    }

    filtered.forEach(item => {
        const w = item.data;
        const id = item.id;
        const st = item.status;

        const card = document.createElement("div");
        card.className = "req-card";

        const info = document.createElement("div");
        info.className = "req-info";
        info.innerHTML = `
            <h4>${escapeHtml(w.userName || "User")} (${escapeHtml(w.userId || "")})</h4>
            <p>Username: ${escapeHtml(w.userUsername || "@user")}</p>
            <p>Wallet: ${escapeHtml(w.walletAddress || "N/A")}</p>
            <div class="req-amount">${Number(w.amount || 0).toFixed(4)} MTR</div>
        `;

        const actions = document.createElement("div");
        actions.className = "req-actions";

        const tag = document.createElement("span");
        tag.className = "status-tag tag-" + st;
        tag.textContent = st;
        actions.append(tag);

        if (st !== "approved") {
            const appBtn = document.createElement("button");
            appBtn.className = "btn-approve";
            appBtn.textContent = "Approve";
            appBtn.onclick = () => updateWithdrawStatus(id, w, "approved", st);
            actions.append(appBtn);
        }

        if (st !== "rejected") {
            const rejBtn = document.createElement("button");
            rejBtn.className = "btn-reject";
            rejBtn.textContent = "Reject";
            rejBtn.onclick = () => updateWithdrawStatus(id, w, "rejected", st);
            actions.append(rejBtn);
        }

        card.append(info, actions);
        listEl.append(card);
    });
}

async function updateWithdrawStatus(docId, wData, newStatus, oldStatus) {
    try {
        await db.collection("withdrawals").doc(docId).update({
            status: newStatus,
            processedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        if (newStatus === "rejected" && oldStatus !== "rejected" && wData.userId && wData.amount) {
            const uRef = db.collection("users").doc(wData.userId);
            const uDoc = await uRef.get();
            if (uDoc.exists) {
                const currentBal = Number(uDoc.data().balance || 0);
                await uRef.set({ balance: currentBal + Number(wData.amount) }, { merge: true });
            }
        }

        if (oldStatus === "rejected" && newStatus === "approved" && wData.userId && wData.amount) {
            const uRef = db.collection("users").doc(wData.userId);
            const uDoc = await uRef.get();
            if (uDoc.exists) {
                const currentBal = Number(uDoc.data().balance || 0);
                await uRef.set({ balance: Math.max(0, currentBal - Number(wData.amount)) }, { merge: true });
            }
        }

        alert(`Withdrawal status updated to ${newStatus.toUpperCase()}!`);
    } catch (err) {
        alert("Error updating withdrawal status.");
    }
}

async function saveReferralSettings() {
    const refTarget = Math.max(1, Number(document.getElementById("cfgRefTarget").value || 5));
    const refTargetReward = Number(document.getElementById("cfgRefTargetReward").value || 0);
    const refCommission = Number(document.getElementById("cfgRefCommission").value || 0);

    try {
        await db.collection("settings").doc("config").set({
            refTarget: refTarget,
            refTargetReward: refTargetReward,
            refCommission: refCommission
        }, { merge: true });
        alert("Referral target & reward settings saved!");
    } catch (err) {
        alert("Failed to save referral settings.");
    }
}

async function saveGeneralSettings() {
    const minWithdraw = Number(document.getElementById("cfgMinWithdraw").value || 10);
    const maxWithdraw = Number(document.getElementById("cfgMaxWithdraw").value || 1000);
    const miningRate = Number(document.getElementById("cfgMiningRate").value || 0.1);
    const verifyFee = Number(document.getElementById("cfgVerifyFee").value || 0.1);
    const withdrawOpen = document.getElementById("cfgWithdrawOpen").value === "true";
    const adminWallet = document.getElementById("cfgAdminWallet").value.trim();

    try {
        await db.collection("settings").doc("config").set({
            minWithdraw: minWithdraw,
            maxWithdraw: maxWithdraw,
            miningRate: miningRate,
            verifyFee: verifyFee,
            withdrawOpen: withdrawOpen,
            adminWallet: adminWallet
        }, { merge: true });
        alert("All settings saved successfully!");
    } catch (err) {
        alert("Failed to save settings.");
    }
}

async function addNewTask() {
    const title = document.getElementById("taskTitle").value.trim();
    const reward = Number(document.getElementById("taskReward").value || 0);
    const link = document.getElementById("taskLink").value.trim();
    const icon = document.getElementById("taskIcon").value.trim() || "📋";

    if (!title) {
        alert("Please enter a task title.");
        return;
    }

    try {
        await db.collection("tasks").add({
            title: title,
            reward: reward,
            link: link,
            icon: icon,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById("taskTitle").value = "";
        document.getElementById("taskLink").value = "";
        alert("New task added!");
    } catch (err) {
        alert("Failed to add task.");
    }
}

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
